<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vakondütő</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Whack-a-mole</h1>

    <div class="game-info">

      <div class="info-card">
        <h2>Pontszám</h2>
        <span id="score">0</span>
      </div>

      <div class="info-card">
        <h2>Idő</h2>
        <span id="time">30</span>
      </div>

    </div>

    <div class="buttons">
      <button id="startBtn" class="btn btn-start">
        Játék indítása
      </button>
    </div>

    <div class="grid">

      <div class="hole" id="0"></div>
      <div class="hole" id="1"></div>
      <div class="hole" id="2"></div>
      <div class="hole" id="3"></div>
      <div class="hole" id="4"></div>
      <div class="hole" id="5"></div>
      <div class="hole" id="6"></div>
      <div class="hole" id="7"></div>
      <div class="hole" id="8"></div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
